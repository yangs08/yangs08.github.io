<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工具调用循环</title>
  <desc id="desc">模型输出下一步动作，程序调用工具，工具返回观察结果，结果再回到上下文。</desc>
  <rect width="960" height="500" rx="24" fill="#f8f7f4"/>
  <circle cx="480" cy="250" r="170" fill="#fff8ef" stroke="#dfd2c4" stroke-width="2"/>
  <rect x="376" y="42" width="208" height="82" rx="18" fill="#ffffff" stroke="#ded8ce"/>
  <text x="480" y="76" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#20201d">1. 模型思考</text>
  <text x="480" y="104" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#706c64">决定下一步要做什么</text>
  <rect x="654" y="208" width="208" height="84" rx="18" fill="#ffffff" stroke="#ded8ce"/>
  <text x="758" y="243" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#20201d">2. 输出动作</text>
  <text x="758" y="271" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#706c64">tool + arguments</text>
  <rect x="376" y="376" width="208" height="84" rx="18" fill="#ffffff" stroke="#ded8ce"/>
  <text x="480" y="411" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#20201d">3. 程序执行</text>
  <text x="480" y="439" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#706c64">真的调用工具</text>
  <rect x="98" y="208" width="208" height="84" rx="18" fill="#ffffff" stroke="#ded8ce"/>
  <text x="202" y="243" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="22" font-weight="800" fill="#20201d">4. 返回观察</text>
  <text x="202" y="271" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#706c64">把结果放回上下文</text>
  <path d="M559 117 C642 139 702 165 736 207" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round"/>
  <path d="M728 183 L738 208 L713 199" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M738 294 C704 340 638 380 586 402" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round"/>
  <path d="M613 406 L586 402 L602 380" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M375 418 C301 395 246 352 217 294" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round"/>
  <path d="M216 321 L217 294 L239 310" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 206 C251 155 319 112 374 91" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round"/>
  <path d="M346 88 L374 91 L357 113" fill="none" stroke="#8f4d2f" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="480" y="238" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="28" font-weight="900" fill="#20201d">Agent Loop</text>
  <text x="480" y="274" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" fill="#706c64">模型说下一步，程序做下一步</text>
</svg>
